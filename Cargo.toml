[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
rocketry-core = { path = "crates/core" }
rocketry-providers = { path = "crates/providers" }
rocketry-store = { path = "crates/store" }
rocketry-tools = { path = "crates/tools" }
rocketry-runtime = { path = "crates/runtime" }
rocketry-server = { path = "crates/server" }
rocketry-tui = { path = "crates/tui" }
