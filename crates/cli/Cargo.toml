[package]
name = "rocketry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rocketry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
rocketry-core.workspace = true
rocketry-providers.workspace = true
rocketry-runtime.workspace = true
rocketry-store.workspace = true
rocketry-tools.workspace = true
rocketry-server.workspace = true
rocketry-tui.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
