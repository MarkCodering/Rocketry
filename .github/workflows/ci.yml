name: Rust verification
on: [push, pull_request]
jobs:
  workspace:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p rocketry-core --no-default-features --locked
      - run: cargo check -p rocketry-runtime --no-default-features --locked
      - run: cargo build -p rocketry-cli --locked
      - run: python3 scripts/pty_smoke.py target/debug/rocketry
      - run: python3 scripts/http_smoke.py target/debug/rocketry
      - run: python3 scripts/provider_smoke.py target/debug/rocketry
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker pull python:3.13-slim
      - run: cargo test -p rocketry-tools --test transports --locked -- --ignored
